<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-app.js"></script><script src="admin.js"></script><title>Dashboard - R-Tech Pure Water</title></head><body><div class="admin-layout"><aside class="sidebar"><h2>💧 R-Tech Pure Water</h2><p class="admin-label">ADMIN PANEL</p><a href="dashboard.html">📊 Dashboard</a><a href="bookings.html">📋 Bookings</a><a href="customers.html">👥 Customers</a><a href="messages.html">✉ Messages</a><a href="#" id="logoutLink">🚪 Logout</a></aside><main class="main-content"><header class="topbar"><div><h1>Dashboard</h1><p>Welcome, <span id="adminName">Admin</span></p></div></header><section class="stats"><div class="stat-card"><span>📋</span><div><h3 id="b">0</h3><p>Total Bookings</p></div></div><div class="stat-card"><span>📅</span><div><h3 id="t">0</h3><p>Today's Bookings</p></div></div><div class="stat-card"><span>👥</span><div><h3 id="c">0</h3><p>Customers</p></div></div><div class="stat-card"><span>✉</span><div><h3 id="m">0</h3><p>Messages</p></div></div></section><section class="recent"><div class="section-header"><h2>Recent Bookings</h2><a href="bookings.html">View All</a></div><div class="table-container"><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Service</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>logoutLink.onclick=e=>{e.preventDefault();logout()};(async()=>{const x=await requireAdmin();if(!x)return;adminName.textContent=x.session.user.email;const s=x.sb;const [b,c,m]=await Promise.all([s.from("water_bookings").select("*",{count:"exact",head:true}),s.from("customers").select("*",{count:"exact",head:true}),s.from("contacts").select("*",{count:"exact",head:true})]);document.getElementById("b").textContent=b.count||0;document.getElementById("c").textContent=c.count||0;document.getElementById("m").textContent=m.count||0;const today=new Date().toISOString().slice(0,10);const tb=await s.from("water_bookings").select("id",{count:"exact",head:true}).eq("booking_date",today);document.getElementById("t").textContent=tb.count||0;const r=await s.from("water_bookings").select("id,name,phone,service,booking_date").order("id",{ascending:false}).limit(10);rows.innerHTML=(r.data||[]).map(v=>row([v.id,v.name,v.phone,v.service,v.booking_date])).join("")||'<tr><td colspan="5" style="text-align:center">No bookings found.</td></tr>'})();</script></body></html>
