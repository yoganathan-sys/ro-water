<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="R-Tech Pure Water - Pure and safe drinking water solutions">
<title>Contact Us - R-Tech Pure Water</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>



<section class="section">

    <div class="container">

        <div class="section-heading">

            <span>CONTACT US</span>

            <h2>
                Let's Talk About
                <span>Your Water Needs</span>
            </h2>

            <p>
                Have a question about our RO services?
                Send us a message.
            </p>

        </div>


        <form class="booking-form"
              id="contactForm"
              novalidate>

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required>

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    required>

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required></textarea>

            </div>


            <button type="submit" class="btn primary-btn">
                Send Message
                <i class="ri-send-plane-line"></i>
            </button>

        </form>

    </div>

</section>



<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-app.js"></script>
<script src="js/layout.js"></script>
<script src="js/script.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
