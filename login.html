<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login - R-Tech Pure Water</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="login-container"><div class="login-card"><div class="logo">💧 R-Tech Pure Water</div><h1>Admin Login</h1><p>Manage your RO Water bookings</p><div id="error" class="error" style="display:none"></div><form id="loginForm"><label>Username</label><input id="username" required placeholder="Enter username"><label>Password</label><input id="password" type="password" required placeholder="Enter password"><button type="submit">Login</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-app.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();try{const email=window.ADMIN_LOGIN_EMAIL;if(!email||email.startsWith("YOUR_"))throw Error("Set ADMIN_LOGIN_EMAIL in js/supabase-config.js");const r=await getSupabaseClient().auth.signInWithPassword({email,password:password.value});if(r.error)throw r.error;location.href="dashboard.html"}catch(x){error.textContent=x.message;error.style.display="block"}}</script></body></html>
